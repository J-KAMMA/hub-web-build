name: Hub web build

# Builds the Hub web app for Cloudflare (OpenNext) on a GitHub-hosted runner
# because the developer PC (Windows) cannot run the OpenNext bundler.
# Build only: no deploy step, no Cloudflare credentials, no secrets, no Git LFS.

on:
  push:
    tags:
      - "web-build-*"
      - "web-analyze-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=7168
      HUB_BUILD_CPUS: "2"
      HUB_NAMED_MODULES: ${{ startsWith(github.ref_name, 'web-analyze-') && 'true' || 'false' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci --no-audit --no-fund
      - name: Next build (build:hub)
        run: npm run build:hub
      - name: OpenNext Cloudflare build (build:hub:cloudflare)
        run: npm run build:hub:cloudflare
      - name: Server module composition (analysis builds)
        if: env.HUB_NAMED_MODULES == 'true'
        continue-on-error: true
        run: node .github/scripts/server-modules.mjs apps/hub/.open-next/server-functions/default/apps/hub/.next/server
      - name: Measure Worker upload size (dry run, no credentials)
        run: |
          set -euo pipefail
          mkdir -p dist
          cd apps/hub
          npx wrangler deploy --dry-run --upload-source-maps --config wrangler.production.jsonc --outdir ../../dist/worker-dry-run 2>&1 | tee ../../dist/worker-size.txt
          grep -i "total upload" ../../dist/worker-size.txt
          node ../../.github/scripts/worker-composition.mjs ../../dist/worker-dry-run/custom-worker.js.map || true
          ls -la ../../dist/worker-dry-run
          KIB=$(grep -i "total upload" ../../dist/worker-size.txt | head -1 | sed -E 's/.*Total Upload: ([0-9]+).*/\1/')
          echo "Total Upload KiB: $KIB"
          if [ "$KIB" -gt 61440 ]; then echo "::error::Worker exceeds 60 MiB"; exit 1; fi
          echo "== largest files in the Worker upload =="
          find ../../dist/worker-dry-run -type f -printf '%s %p\n' | sort -nr | head -40 || true
          echo "== largest server chunks in .open-next =="
          find .open-next -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.wasm' \) -printf '%s %p\n' | sort -nr | head -60 || true
      - name: Package and hash OpenNext output
        run: |
          set -euo pipefail
          test -d apps/hub/.open-next
          mkdir -p dist
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -C apps/hub -cf - .open-next | gzip -n > dist/hub-web-open-next.tar.gz
          (cd dist && sha256sum hub-web-open-next.tar.gz | tee hub-web-open-next.tar.gz.sha256)
          (cd apps/hub/.open-next && find . -type f -print0 | sort -z | xargs -0 sha256sum) > dist/hub-web-open-next.files.sha256
          wc -l dist/hub-web-open-next.files.sha256
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hub-web-open-next-${{ env.SHORT_SHA }}
          path: |
            dist/hub-web-open-next.tar.gz
            dist/hub-web-open-next.tar.gz.sha256
            dist/hub-web-open-next.files.sha256
          retention-days: 7
          if-no-files-found: error
